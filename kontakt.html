<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt — XMedia Apps</title>
  <meta name="description" content="Kontaktformular von XMedia Apps." />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#000000" />
  <link rel="canonical" href="https://xmedia-apps.com/kontakt.html" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=19" />
</head>
<body class="page-stage page-kontakt">
  <canvas id="tubes-bg" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="site-header-inner">
      <a class="logo" href="/">
        <img src="/assets/logo-xm.png" width="28" height="28" alt="" />
        <span>XMedia Apps</span>
      </a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="/">Start</a>
        <a href="/apps.html">Projekte</a>
        <a href="/studio.html">Studio</a>
        <a href="/kontakt.html" aria-current="page">Kontakt</a>
        <a href="/rechtliches.html">Rechtliches</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="stage stage--form">
      <h1 class="stage-title stage-title--page" aria-label="Kontakt">
        <span class="letter-wrap"><span class="letter">K</span></span><span class="letter-wrap"><span class="letter">o</span></span><span class="letter-wrap"><span class="letter">n</span></span><span class="letter-wrap"><span class="letter">t</span></span><span class="letter-wrap"><span class="letter">a</span></span><span class="letter-wrap"><span class="letter">k</span></span><span class="letter-wrap"><span class="letter">t</span></span>
      </h1>
      <div class="stage-line" aria-hidden="true"></div>
      <p class="stage-tag stage-copy">
        Fragen zu Apps, Partnerschaften oder Support? Schreib uns —
        oder direkt an <a href="mailto:x9x3@pm.me">x9x3@pm.me</a>.
      </p>

      <div class="stage-panel stage-form-wrap">
        <div class="form-success" id="sent" hidden>
          Danke — deine Nachricht wurde gesendet. Wir melden uns bei dir.
        </div>

        <form
          class="contact-form"
          action="https://formsubmit.co/x9x3@pm.me"
          method="POST"
        >
          <input type="hidden" name="_subject" value="Kontaktanfrage — XMedia Apps" />
          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_next" value="https://xmedia-apps.com/kontakt.html?sent=1" />
          <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />

          <label>
            Name
            <input type="text" name="name" required autocomplete="name" />
          </label>
          <label>
            E-Mail
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label>
            Nachricht
            <textarea name="message" required></textarea>
          </label>

          <div class="form-actions">
            <button class="btn solid" type="submit">Absenden</button>
            <p class="form-note">
              Wird an x9x3@pm.me gesendet. Hinweise:
              <a href="/privacy.html#kontaktformular">Datenschutz</a>
            </p>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script src="/main.js?v=12"></script>
  <script type="module" src="/tubes-bg.js?v=11"></script>
  <script>
    if (new URLSearchParams(location.search).get("sent") === "1") {
      var box = document.getElementById("sent");
      if (box) box.hidden = false;
    }
  </script>
</body>
</html>
